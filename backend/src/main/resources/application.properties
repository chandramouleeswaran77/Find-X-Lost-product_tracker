spring.application.name=backend

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/findx
spring.data.mongodb.database=findx

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth
google.oauth.client-id=${GOOGLE_CLIENT_ID:your-google-oauth-client-id}

# JWT
jwt.secret=${JWT_SECRET:your-jwt-secret-key-at-least-32-bytes-long}
jwt.expiration-ms=86400000

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Configuration (Log-only mode for development)
# Uncomment the following line to disable actual email sending and log instead
# spring.mail.host=localhost
